name: YouTube Auto-Production Pipeline

on:
  schedule:
    # 毎朝8時（UTC 23時）に実行
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 手動実行時：タイトルを入力すれば動画生成まで、空欄なら分析のみ行う
    inputs:
      video_title:
        description: '生成する動画タイトル（空欄の場合はトレンド分析のみ実行）'
        required: false

jobs:
  # --- ジョブ1：トレンド分析（Groqへ完全移行） ---
  trend_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Analysis Libs
        # google-genaiを削除し、groqをインストール
        run: pip install groq requests
      - name: Analyze and Notify
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python3 <<EOF
          import os, requests
          from groq import Groq

          client = Groq(api_key=os.getenv("GROQ_API_KEY"))
          
          # 高性能な Llama 3.3 70B を使用（Gemma2-9b-it などに変更可能）
          model_name = "llama-3.3-70b-versatile"

          prompt = """
          あなたはYouTubeプロデューサーです。最新トレンドを分析し、バズる企画を3つ立案してください。
          【出力フォーマット】
          📊 【本日の市場トレンド分析】
          ・トレンド：(簡潔に)
          ・分析根拠：(なぜ今か、2行で)
          💡 【YouTube動画企画案】
          1. [タイトル]：[勝算を短く]
          2. [タイトル]：[勝算を短く]
          3. [タイトル]：[勝算を短く]
          作成する企画の番号を返信してください。
          """

          try:
              completion = client.chat.completions.create(
                  model=model_name,
                  messages=[
                      {"role": "system", "content": "あなたは優秀なYouTubeプロデューサーです。"},
                      {"role": "user", "content": prompt}
                  ],
                  temperature=0.7,
              )
              response_text = completion.choices[0].message.content
          except Exception as e:
              print(f"Groq API Error: {e}")
              exit(1)

          url = f"https://discord.com/api/v10/channels/{os.getenv('DISCORD_CHANNEL_ID')}/messages"
          requests.post(url, headers={"Authorization": f"Bot {os.getenv('DISCORD_BOT_TOKEN')}"}, json={"content": response_text})
          EOF

  # --- ジョブ2：動画生成（手動実行かつタイトルが入力された時のみ実行） ---
  generate_video:
    needs: trend_analysis
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.video_title != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Production Libs
        run: pip install -r requirements.txt

      - name: Run Video Engine
        env:
          # main.py側でもGroqを使うように修正が必要です
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INPUT_VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          WORK_DIR: "work"
        run: python main.py
