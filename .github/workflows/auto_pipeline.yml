name: YouTube Auto Pipeline Manager

on:
  # 毎朝8時（日本時間で夕方や朝などお好きな時間に調整可能。UTC基準）に自動で企画案をメール送信
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = 日本時間 8:00
  
  # 手動でいつでもトリガーできるようにする
  workflow_dispatch:
    inputs:
      action_type:
        description: "実行するアクションを選択"
        required: true
        default: "send_ideas"
        type: choice
        options:
          - "send_ideas"        # 企画案をメール送信する
          - "check_replies"     # メールの返信をチェックして動画を作る
          - "run_all_manual"    # すぐに動画を作る（テーマ指定）

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install --no-cache-dir edge-tts requests Pillow json_repair google-api-python-client google-auth-oauthlib

      - name: 企画案メールの送信 (send_ideas)
        if: github.event_name == 'schedule' || github.event.inputs.action_type == 'send_ideas'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
        run: |
          python notify_ideas.py

      - name: 返信のチェックと自動生成 (check_replies)
        if: github.event.inputs.action_type == 'check_replies'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
        run: |
          python receive_and_trigger.py
