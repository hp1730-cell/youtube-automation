name: YouTube Auto-Production Pipeline

# ─────────────────────────────────────────────────────────────
# ・企画案の送信 : 毎朝 JST 8:07 ごろ（cron は遅れることがあるため "分" を 0 からずらしています）
# ・返信チェック : JST 8:23〜12:23 ごろ 毎時
# ・動画生成     : 返信チェックが workflow_dispatch で起動（手動実行も可）
# ※ ジョブの振り分けは「時刻」ではなく「どの cron で起動されたか」で判定するため、
#   GitHub 側の実行遅延があってもスキップされません。
# ※ cron 文字列を変更するときは、下の各ジョブの if 条件も同じ文字列に揃えてください。
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '7 23 * * *'            # 企画案送信 (UTC 23:07 = JST 8:07)
    - cron: '23 23,0,1,2,3 * * *'   # 返信チェック (JST 8:23, 9:23, 10:23, 11:23, 12:23)
  workflow_dispatch:
    inputs:
      action_mode:
        description: '実行モード'
        required: true
        default: 'analyze'
        type: choice
        options:
          - analyze
          - check_replies
          - generate_video
      video_title:
        description: '動画のテーマ（generate_video を手動実行するとき用）'
        required: false
        type: string
      plan_text:
        description: '企画案の本文（返信チェックから自動で渡されます）'
        required: false
        type: string
      skip_upload:
        description: 'YouTube へのアップロードを行わない'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # --- ジョブ1：トレンド分析 → Discord に企画案を送信 ---
  trend_analysis:
    if: github.event.schedule == '7 23 * * *' || (github.event_name == 'workflow_dispatch' && inputs.action_mode == 'analyze')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libs
        run: pip install groq requests json-repair
      - name: Analyze and notify
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}      # 任意（急上昇動画の取得に使用）
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CHANNEL_THEME: ${{ vars.CHANNEL_THEME }}             # 任意（例: 雑学・歴史の解説）
        run: python analyze.py

  # --- ジョブ2：Discord の返信チェック → 動画生成を起動 ---
  discord_check:
    if: github.event.schedule == '23 23,0,1,2,3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.action_mode == 'check_replies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libs
        run: pip install requests
      - name: Check replies
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ALLOWED_USER_ID: ${{ vars.DISCORD_ALLOWED_USER_ID }}  # 任意（自分の返信だけ受け付ける）
          GH_PAT: ${{ secrets.GH_PAT }}
          WORKFLOW_FILE: auto_pipeline.yml   # このファイルの名前と一致させる
        run: python check_discord.py

  # --- ジョブ3：動画生成 → 非公開アップロード ---
  generate_video:
    if: github.event_name == 'workflow_dispatch' && inputs.action_mode == 'generate_video'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: generate-video
      cancel-in-progress: false
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python libs
        run: pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}       # 任意（画像生成失敗時の予備）
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }} # 任意（画像生成の制限緩和）
          CHANNEL_THEME: ${{ vars.CHANNEL_THEME }}
          VOICEVOX_SPEAKER: ${{ vars.VOICEVOX_SPEAKER }}        # 任意（話者ID。未設定なら 3=ずんだもん）
          INPUT_VIDEO_TITLE: ${{ inputs.video_title }}
          INPUT_PLAN_TEXT: ${{ inputs.plan_text }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}   # 台本完成・失敗の通知用
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          VOICEVOX_URL: http://localhost:50021
          WORK_DIR: work
        run: python main.py

      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/metadata.json
            work/script.json
            work/research.md
            work/review.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload to YouTube (private)
        if: success() && inputs.skip_upload != true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          WORK_DIR: work
        run: python upload_youtube.py
