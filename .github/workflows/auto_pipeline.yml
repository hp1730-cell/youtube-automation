import os
import sys
import logging
import requests
from google import genai
from google.genai import types

# --- ロガーの初期化 ---
logging.basicConfig(
    level=logging.INFO,
    format='%(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s'
)
log = logging.getLogger(__name__)

# 環境変数から取得
DISCORD_BOT_TOKEN = os.getenv("DISCORD_BOT_TOKEN")
DISCORD_CHANNEL_ID = os.getenv("DISCORD_CHANNEL_ID")
GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")

def main():
    log.info("--- YouTube企画案・市場分析＆自動送信プログラム開始 ---")

    if not GEMINI_API_KEY or not DISCORD_BOT_TOKEN or not DISCORD_CHANNEL_ID:
        log.error("必要な環境変数（GEMINI_API_KEY, DISCORD_BOT_TOKEN, DISCORD_CHANNEL_ID）が設定されていません。")
        sys.exit(1)

    # 1. Geminiで最新トレンドの検索・分析と企画案の生成
    log.info("Geminiが最新のトレンドを検索・分析し、企画案と分析結果を構築中...")
    try:
        client = genai.Client(api_key=GEMINI_API_KEY)
        
        # 分析と出力構造を明確にしたプロンプト
        prompt = """
あなたはYouTubeの優秀なプロデューサー兼マーケティングコンサルタントです。
以下の手順に従い、本気でバズるYouTube企画を立案してください。

1. 【市場分析・トレンドリサーチ】
現在のインターネット上のトレンド、直近で話題のニュース、SNSの動向、人々の関心をGoogle検索で徹底的にリサーチし、「今なぜこのテーマが求められているのか」の背景を論理的に分析してください。

2. 【動画企画案の立案】
上記の分析結果に基づき、視聴者を引き込みやすいYouTubeの動画企画案を3つ作成してください。

【出力フォーマット（必ずこの形式に従ってください）】
📊 【本日の市場トレンド分析】
（ここに、現在のトレンドや「なぜ今このテーマなのか」の分析を論理的にまとめてください）

💡 【YouTube動画企画案（全3選）】
1. タイトル：[企画タイトル]
   - 概要：[簡単な概要]
   - なぜ今これがウケるのか（勝算）：[分析に基づく理由]

2. タイトル：[企画タイトル]
   - 概要：[簡単な概要]
   - なぜ今これがウケるのか（勝算）：[分析に基づく理由]

3. タイトル：[企画タイトル]
   - 概要：[簡単な概要]
   - なぜ今これがウケるのか（勝算）：[分析に基づく理由]

どの企画で動画を作成しますか？「1」「2」「3」のいずれかをこのスレッドに返信してください。
"""
        
        # Google検索グラウンディングを有効化し、リアルタイムデータに基づく分析を行わせる
        response = client.models.generate_content(
            model='gemini-2.5-flash',
            contents=prompt,
            config=types.GenerateContentConfig(
                tools=[{"google_search": {}}],
                temperature=0.7,
            ),
        )
        ideas_text = response.text
        log.info("市場分析および企画案の生成に成功しました。")
    except Exception as e:
        log.error(f"Gemini APIでの生成中にエラーが発生しました: {e}")
        sys.exit(1)

    # 2. Discordへ送信
    log.info(f"Discordチャンネル ({DISCORD_CHANNEL_ID}) へ送信中...")
    url = f"https://discord.com/api/v10/channels/{DISCORD_CHANNEL_ID}/messages"
    headers = {
        "Authorization": f"Bot {DISCORD_BOT_TOKEN}",
        "Content-Type": "application/json"
    }
    payload = {"content": ideas_text}

    try:
        res = requests.post(url, headers=headers, json=payload, timeout=30)
        res.raise_for_status()
        log.info("Discordへの分析レポートおよび企画案の送信が完了しました！")
    except Exception as e:
        log.error(f"Discordへの送信に失敗しました: {e}")
        sys.exit(1)

if __name__ == "__main__":
    main()
