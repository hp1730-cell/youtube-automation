name: Discord-to-GitHub-Trigger

on:
  # 1. 毎日 日本時間 朝8:00 に自動実行
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = 日本時間 翌朝 08:00
  
  # 2. 手動でいつでも実行可能
  workflow_dispatch:

jobs:
  check-discord:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリのインストール
        run: pip install requests

      - name: Discordチェックとワークフロー起動
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python check_discord.py  # ← あなたのPythonファイル名に書き換えてください
