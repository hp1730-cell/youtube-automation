import os
import sys
import logging
import requests
from google import genai
from google.genai import types

# --- ロガーの初期化 ---
logging.basicConfig(
    level=logging.INFO,
    format='%(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s'
)
log = logging.getLogger(__name__)

# 環境変数から取得
DISCORD_BOT_TOKEN = os.getenv("DISCORD_BOT_TOKEN")
DISCORD_CHANNEL_ID = os.getenv("DISCORD_CHANNEL_ID")
GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")

def send_discord_message(text):
    """Discordへメッセージを送信する"""
    url = f"https://discord.com/api/v10/channels/{DISCORD_CHANNEL_ID}/messages"
    headers = {
        "Authorization": f"Bot {DISCORD_BOT_TOKEN}",
        "Content-Type": "application/json"
    }
    payload = {"content": text}
    res = requests.post(url, headers=headers, json=payload, timeout=30)
    res.raise_for_status()

def main():
    log.info("--- YouTube企画案・分析エッセンス送信プログラム開始 ---")

    if not GEMINI_API_KEY or not DISCORD_BOT_TOKEN or not DISCORD_CHANNEL_ID:
        log.error("必要な環境変数（GEMINI_API_KEY, DISCORD_BOT_TOKEN, DISCORD_CHANNEL_ID）が設定されていません。")
        sys.exit(1)

    log.info("Geminiが最新トレンドを分析し、企画を立案中...")
    try:
        client = genai.Client(api_key=GEMINI_API_KEY)
        
        # 分析の根拠を少し出すようにプロンプトを調整
        prompt = """
あなたはYouTubeの超一流プロデューサー兼マーケティングコンサルタントです。
Google検索を用いて最新トレンドを徹底的にリサーチし、今最もバズる可能性が高い企画を3つ立案してください。

【重要：出力形式】
詳細な思考プロセスは内部で完結させ、Discordへ送信するため、以下の【出力フォーマット】のみを返してください。
挨拶や「承知いたしました」などの前置きは一切不要です。

【出力フォーマット】
📊 【本日の市場トレンド分析】
・現在の主要トレンド：(いま何が話題か)
・分析根拠：(なぜ今これが求められているのか、どのようなユーザー心理があるのかを2行で簡潔に)

💡 【YouTube動画企画案（全3選）】
1. [タイトル]
   - 勝算：[なぜこれでバズるのか、具体的な理由を短く]

2. [タイトル]
   - 勝算：[なぜこれでバズるのか、具体的な理由を短く]

3. [タイトル]
   - 勝算：[なぜこれでバズるのか、具体的な理由を短く]

作成する企画の番号（1〜3）を返信してください。
"""
        
        response = client.models.generate_content(
            model='gemini-2.0-flash', 
            contents=prompt,
            config=types.GenerateContentConfig(
                tools=[{"google_search": {}}],
                temperature=0.7,
            ),
        )
        ideas_text = response.text
        log.info("分析および企画案の生成に成功しました。")
    except Exception as e:
        log.error(f"Gemini APIエラー: {e}")
        sys.exit(1)

    # Discordへ送信
    log.info(f"Discordへ送信中...")
    try:
        send_discord_message(ideas_text)
        log.info("Discordへの送信が完了しました！")
    except Exception as e:
        log.error(f"Discord送信失敗: {e}")
        sys.exit(1)

if __name__ == "__main__":
    main()