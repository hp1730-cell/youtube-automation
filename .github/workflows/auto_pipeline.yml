name: YouTube Auto-Production Pipeline

on:
  schedule:
    # 毎朝8時（UTC 23時）に実行
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 手動実行時：タイトルを入力すれば動画生成まで、空欄なら分析のみ行う
    inputs:
      video_title:
        description: '生成する動画タイトル（空欄の場合はトレンド分析のみ実行）'
        required: false

jobs:
  # --- ジョブ1：トレンド分析（自動・手動 両方で必ず実行） ---
  trend_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Analysis Libs
        run: pip install google-genai requests
      - name: Analyze and Notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python3 <<EOF
          import os, requests
          from google import genai
          from google.genai import types
          client = genai.Client(api_key=os.getenv("GEMINI_API_KEY"))
          prompt = """
          あなたはYouTubeプロデューサーです。最新トレンドを分析し、バズる企画を3つ立案してください。
          【出力フォーマット】
          📊 【本日の市場トレンド分析】
          ・トレンド：(簡潔に)
          ・分析根拠：(なぜ今か、2行で)
          💡 【YouTube動画企画案】
          1. [タイトル]：[勝算を短く]
          2. [タイトル]：[勝算を短く]
          3. [タイトル]：[勝算を短く]
          作成する企画の番号を返信してください。
          """
          response = client.models.generate_content(
              model='gemini-2.0-flash',
              contents=prompt,
              config=types.GenerateContentConfig(tools=[{"google_search": {}}])
          )
          url = f"https://discord.com/api/v10/channels/{os.getenv('DISCORD_CHANNEL_ID')}/messages"
          requests.post(url, headers={"Authorization": f"Bot {os.getenv('DISCORD_BOT_TOKEN')}"}, json={"content": response.text})
          EOF

  # --- ジョブ2：動画生成（手動実行かつタイトルが入力された時のみ実行） ---
  generate_video:
    # トレンド分析が終わった後に実行
    needs: trend_analysis
    # 手動実行であり、かつ video_title が空ではない場合のみ動かす
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.video_title != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Production Libs
        run: pip install -r requirements.txt

      - name: Run Video Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INPUT_VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          WORK_DIR: "work"
        run: python main.py
