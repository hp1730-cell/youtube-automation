name: YouTube Auto-Production Pipeline

on:
  schedule:
    # 日本時間 8:00, 9:00, 10:00, 11:00, 12:00 に実行 (UTC 23, 0, 1, 2, 3)
    - cron: '0 23,0,1,2,3 * * *'
  workflow_dispatch:
    inputs:
      action_mode:
        description: '実行するモードを選択してください'
        required: true
        default: 'analyze'
        type: choice
        options:
          - analyze         # トレンド分析
          - check_replies   # Discord返信チェック（受信）
          - generate_video  # 直接動画生成
      video_title:
        description: '動画タイトル（generate_video選択時のみ使用）'
        required: false

jobs:
  # --- ジョブ1：トレンド分析（送信） ---
  trend_analysis:
    # 【修正】ここでdatetimeを使わず、シンプルに起動条件だけを指定
    if: github.event.inputs.action_mode == 'analyze' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Analysis Libs
        run: pip install groq requests
      - name: Analyze and Notify
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python3 <<EOF
          import os, requests, datetime
          from groq import Groq
          from datetime import timezone, timedelta

          # --- 【ここで時間を判定】 ---
          # 日本時間で現在時刻を取得
          now_jst = datetime.datetime.now(timezone(timedelta(hours=9)))
          
          # 手動実行(workflow_dispatch)の場合は、時間に関わらず実行する
          # スケジュール実行(schedule)の場合は、8時台のみ実行する
          is_manual = os.getenv("GITHUB_EVENT_NAME") != "schedule"
          if not is_manual and now_jst.hour != 8:
              print(f"現在は日本時間 {now_jst.hour}時です。分析は8時のみ実行するためスキップします。")
              exit(0)

          print("分析処理を開始します...")
          client = Groq(api_key=os.getenv("GROQ_API_KEY"))
          model_name = "openai/gpt-oss-120b"
          prompt = """
          あなたはYouTubeプロデューサーです。最新トレンドを分析し、バズる企画を3つ立案してください。
          【出力フォーマット】
          📊 【本日の市場トレンド分析】
          ・トレンド：(簡潔に)
          ・分析根拠：(なぜ今か、2行で)
          💡 【YouTube動画企画案】
          1. [タイトル]：[勝算を短く]
          2. [タイトル]：[勝算を短く]
          3. [タイトル]：[勝算を短く]
          作成する企画の番号を返信してください。
          """

          try:
              full_prompt = f"あなたは優秀なYouTubeプロデューサーです。\n\n{prompt}"
              completion = client.chat.completions.create(
                  model=model_name,
                  messages=[{"role": "user", "content": full_prompt}],
                  temperature=0.7,
              )
              response_text = completion.choices[0].message.content
          except Exception as e:
              print(f"Groq API Error: {e}")
              exit(1)

          url = f"https://discord.com/api/v10/channels/{os.getenv('DISCORD_CHANNEL_ID')}/messages"
          requests.post(url, headers={"Authorization": f"Bot {os.getenv('DISCORD_BOT_TOKEN')}"}, json={"content": response_text})
          EOF

  # --- ジョブ2：Discord返信チェック（受信） ---
  discord_check:
    if: github.event.inputs.action_mode == 'check_replies' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run Checker Script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python discord_check.py

  # --- ジョブ3：動画生成（実行） ---
  generate_video:
    if: github.event.inputs.action_mode == 'generate_video' && github.event.inputs.video_title != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Production Libs
        run: pip install -r requirements.txt
      - name: Run Video Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INPUT_VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          WO
