name: YouTube Auto Pipeline

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: '動画のテーマ'
        required: true
      video_genre:
        description: '動画のジャンル（自動判定も可）'
        required: false
        default: '自動判定'
      video_tone:
        description: 'ナレーションの雰囲気'
        required: false
        default: 'わかりやすく、最後まで見たくなる雰囲気'
      dry_run:
        description: 'trueなら動画を作るだけで投稿しない(動作確認用)'
        required: false
        default: 'false'

concurrency:
  group: youtube-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: FFmpegと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 動画の生成とYouTube投稿
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          INPUT_VIDEO_GENRE: ${{ github.event.inputs.video_genre }}
          INPUT_VIDEO_TONE: ${{ github.event.inputs.video_tone }}
          NARRATION_SPEED: '1.25'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python cloud_upload.py

      - name: 生成した成果物を保存(確認用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-auto-output
          path: |
            work/ai_drama_output.mp4
            work/script.json
            work/research.json
            work/outline.json
            work/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 3
