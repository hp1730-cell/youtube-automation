name: YouTube Auto Pipeline

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: "動画のテーマ"
        required: true
        type: string

      video_genre:
        description: "動画のジャンル"
        required: false
        default: "自動判定"
        type: string

      video_tone:
        description: "ナレーションの雰囲気"
        required: false
        default: "わかりやすく、最後まで見たくなる雰囲気"
        type: string

      spreadsheet_row:
        description: "スプレッドシートの行番号"
        required: false
        default: ""
        type: string

      dry_run:
        description: "trueなら動画を作るだけで投稿しない"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: youtube-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: FFmpegと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 必須設定の確認
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          VIDEO_TITLE: ${{ inputs.video_title }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEYが未登録です"
            exit 1
          fi

          if [ -z "$TOKEN_JSON" ]; then
            echo "::error::TOKEN_JSONが未登録です"
            exit 1
          fi

          if [ -z "$VIDEO_TITLE" ]; then
            echo "::error::動画テーマが空です"
            exit 1
          fi

          echo "必須設定を確認しました"

      - name: 動画の生成とYouTube投稿
        env:
          # 既存のGitHub Secrets
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # OpenRouterは登録した場合だけ使用
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "openrouter/free"

          # GeminiはOpenRouter失敗時の予備
          GEMINI_MODEL: "gemini-2.5-flash"

          # スプレッドシートまたは手動入力から渡される情報
          INPUT_VIDEO_TITLE: ${{ inputs.video_title }}
          INPUT_VIDEO_GENRE: ${{ inputs.video_genre }}
          INPUT_VIDEO_TONE: ${{ inputs.video_tone }}
          INPUT_SPREADSHEET_ROW: ${{ inputs.spreadsheet_row }}

          # ナレーション
          EDGE_VOICE: "ja-JP-NanamiNeural"
          NARRATION_SPEED: "1.10"

          # 初回は非公開
          PRIVACY_STATUS: "private"

          # 動画投稿設定
          UPLOAD_TO_YOUTUBE: "true"
          DRY_RUN: ${{ inputs.dry_run }}

          # 出力先
          WORK_DIR: "work"

        run: |
          python main.py

      - name: 生成した成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-auto-output-${{ github.run_id }}

          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/metadata.json
            work/subtitles.srt
            work/raw_video.mp4
            work/narration.m4a

          if-no-files-found: ignore
          retention-days: 7
