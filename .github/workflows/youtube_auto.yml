name: YouTube Auto Pipeline

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: "動画のテーマ"
        required: true
        type: string

      video_genre:
        description: "動画のジャンル"
        required: false
        default: "自動判定"
        type: string

      video_tone:
        description: "ナレーションの雰囲気"
        required: false
        default: "わかりやすく、最後まで見たくなる雰囲気"
        type: string

      dry_run:
        description: "trueなら動画を作るだけでYouTubeへ投稿しない"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: youtube-auto
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: FFmpegと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Pythonライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          # requirements.txtがなくても動作するように、直接主要ライブラリを指定してインストールします
          pip install duckduckgo_search edge-tts requests trafilatura google-api-python-client google-auth-oauthlib Pillow json_repair moviepy
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: 必須設定の確認
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_TITLE: ${{ inputs.video_title }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEYが未登録です"
            exit 1
          fi
          if [ -z "$TOKEN_JSON" ]; then
            echo "::error::TOKEN_JSONが未登録です"
            exit 1
          fi
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "::error::PIXABAY_API_KEYが未登録です"
            exit 1
          fi
          if [ -z "$VIDEO_TITLE" ]; then
            echo "::error::動画テーマが空です"
            exit 1
          fi
          echo "必須設定を確認しました"

      - name: main.pyの構文確認
        run: |
          if [ ! -f "main.py" ]; then
            echo "::error::リポジトリ直下にmain.pyがありません"
            exit 1
          fi
          python -m py_compile main.py
          echo "main.pyの構文チェックに成功しました"

      - name: 動画の生成とYouTube投稿
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INPUT_VIDEO_TITLE: ${{ inputs.video_title }}
          INPUT_VIDEO_GENRE: ${{ inputs.video_genre }}
          INPUT_VIDEO_TONE: ${{ inputs.video_tone }}
          EDGE_VOICE: "ja-JP-NanamiNeural"
          PRIVACY_STATUS: "private"
          UPLOAD_TO_YOUTUBE: "true"
          DRY_RUN: ${{ inputs.dry_run }}
          PIXABAY_RESULTS_PER_QUERY: "20"
          WORK_DIR: "work"
        run: |
          python main.py

      - name: 生成結果の確認
        if: always()
        run: |
          echo "========== workフォルダ =========="
          if [ -d "work" ]; then
            find work -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          else
            echo "workフォルダはありません"
          fi
          echo "=================================="

      - name: 生成した成果物を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-auto-output-${{ github.run_id }}
          # main.pyの実際の出力ファイル名に合わせて修正
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/metadata.json
            work/script.json
            work/research.json
            work/subtitles.ass
            work/raw.mp4
            work/visual.mp4
            work/narration.m4a
            work/pixabay_credits.json
          if-no-files-found: ignore
          retention-days: 7
