name: YouTube Auto Pipeline

on:
  workflow_dispatch:
    inputs:
      video_title:
        description: '動画のテーマ'
        required: true
      video_genre:
        description: '動画のジャンル'
        required: false
        default: '雑学'
      video_tone:
        description: 'ナレーションの雰囲気'
        required: false
        default: '標準'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpegのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 自動生成およびYouTube投稿の実行
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          INPUT_VIDEO_GENRE: ${{ github.event.inputs.video_genre }}
          INPUT_VIDEO_TONE: ${{ github.event.inputs.video_tone }}
        run: |
          python cloud_upload.py
